<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">helium-nix</title>
  <desc id="desc">A clean violet Helium atom and browser window beside the title Helium for Nix and NixOS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b18"/>
      <stop offset="0.55" stop-color="#12132a"/>
      <stop offset="1" stop-color="#1d1230"/>
    </linearGradient>
    <linearGradient id="helium" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ef6ff"/>
      <stop offset="0.45" stop-color="#8c7cff"/>
      <stop offset="1" stop-color="#e17cff"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#b8f8ff"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#a9a2ff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="205" cy="180" r="122" fill="#7769ff" opacity="0.08"/>
  <g transform="translate(205 180)" fill="none" stroke="url(#helium)" stroke-width="8" filter="url(#glow)">
    <ellipse rx="118" ry="42" transform="rotate(18)"/>
    <ellipse rx="118" ry="42" transform="rotate(138)"/>
    <ellipse rx="118" ry="42" transform="rotate(258)"/>
  </g>
  <circle cx="205" cy="180" r="28" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="311" cy="215" r="10" fill="#9ff8ff" filter="url(#glow)"/>
  <circle cx="114" cy="119" r="10" fill="#df85ff" filter="url(#glow)"/>
  <circle cx="188" cy="294" r="10" fill="#9c8aff" filter="url(#glow)"/>
  <g transform="translate(405 71)">
    <rect width="708" height="218" rx="24" fill="#090d1d" stroke="#8378e8" stroke-opacity="0.45" stroke-width="2"/>
    <rect width="708" height="45" rx="24" fill="#17172f"/>
    <path d="M0 45h708" stroke="#8378e8" stroke-opacity="0.35"/>
    <circle cx="28" cy="23" r="6" fill="#ff7cae"/><circle cx="49" cy="23" r="6" fill="#ffd071"/><circle cx="70" cy="23" r="6" fill="#7df0c4"/>
    <text x="44" y="111" fill="#f6f5ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="750">helium-nix</text>
    <text x="46" y="154" fill="#b9b6d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Helium Browser for Nix and NixOS</text>
    <g transform="translate(46 177)">
      <rect width="155" height="28" rx="14" fill="#7368ef" fill-opacity="0.18" stroke="#9d94ff" stroke-opacity="0.45"/>
      <text x="18" y="20" fill="#c9c5ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">verified updates</text>
      <rect x="169" width="132" height="28" rx="14" fill="#46d8d0" fill-opacity="0.12" stroke="#77ece5" stroke-opacity="0.42"/>
      <text x="190" y="20" fill="#a8f5f0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">native package</text>
    </g>
  </g>
</svg>
