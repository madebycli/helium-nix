name: CI
# Verifies the current public direct-repository installation path.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9

      - name: Verify signed release metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/update.py
          python3 scripts/update.py --force
          git diff --exit-code -- version.nix
          python3 scripts/update.py --check
          nix flake lock
          git diff --exit-code -- flake.lock

      - name: Evaluate and test
        run: |
          set -euo pipefail
          nix flake show --no-write-lock-file
          nix flake check --no-write-lock-file --print-build-logs

      - name: Build Helium
        run: |
          set -euo pipefail
          nix build .#helium --no-write-lock-file --print-build-logs
          test -x ./result/bin/helium
          ./result/bin/helium --version

      - name: Verify direct GitHub profile install
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIRECT_PROFILE: ${{ runner.temp }}/helium-profile
        run: |
          set -euo pipefail
          nix profile add --profile "$DIRECT_PROFILE" \
            "github:${GITHUB_REPOSITORY}#helium"
          test -x "$DIRECT_PROFILE/bin/helium"
          "$DIRECT_PROFILE/bin/helium" --version
